<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Clínica Fisio</title>
	<h:outputStylesheet name="css/estilo.css" />
	<style>
body {
	margin: 0;
	font-family: Arial, sans-serif;
	overflow: hidden;
}

.wrapper {
	display: flex;
	flex-direction: column;
	height: 100vh;
}

/* Toolbar fixa no topo */
.header {
	background: #007ad9 !important;
	color: white !important;
	border: none !important;
}

.main-content {
	display: flex;
	flex: 1;
	overflow: hidden;
}

/* Estilo do Menu Lateral com transição suave */
.menu-lateral {
	width: 250px;
	border-right: 1px solid #ccc;
	background: #f8f9fa;
	transition: all 0.3s ease;
	overflow-x: hidden;
	white-space: nowrap;
}

/* Classe para quando o menu estiver recolhido */
.menu-recolhido {
	width: 0px;
	border-right: none;
	padding: 0;
}

.conteudo-central {
	flex: 1;
	padding: 20px;
	overflow-y: auto;
	background: #fff;
}

/* Ajuste para os ícones do toolbar */
.ui-toolbar-group-left {
	display: flex;
	align-items: center;
	gap: 10px;
}
</style>
</h:head>

<h:body>
	<div class="wrapper">
		<h:form id="headerForm">
			<p:toolbar styleClass="header">
				<f:facet name="left">
					<p:commandLink action="#{templateBean.toggleMenu}" ajax="false"
						update=":layoutGroup" style="color: white; margin-right: 10px;">
						<i class="pi pi-bars" style="font-size: 1.5rem;"></i>
					</p:commandLink>

					<h:outputText value="Clinica Fisio"
						style="font-weight: bold; font-size: 1.2em; color:white;" />
				</f:facet>

				<f:facet name="right">
					<p:commandButton value="Sair" action="#{loginBean.logout}"
						icon="pi pi-power-off" ajax="false" />
				</f:facet>
			</p:toolbar>
		</h:form>

		<h:panelGroup id="layoutGroup" layout="block"
			styleClass="main-content">

			<aside
				class="menu-lateral #{templateBean.menuRecolhido ? 'menu-recolhido' : ''}">
				<h:form id="menuForm">
					<p:panelMenu style="width:100%"
						rendered="#{!templateBean.menuRecolhido}">
						<p:submenu label="Navegação">
							<p:menuitem value="Início (Home)" action="irParaHome"
								actionListener="#{templateBean.mostrarMenu()}"
								icon="pi pi-home" ajax="false" />
						</p:submenu>
						<p:submenu label="Módulos">
							<p:menuitem value="Consultar Paciente" action="paciente"
								actionListener="#{templateBean.esconderMenu()}"
								icon="pi pi-users" ajax="false" />
						<p:menuitem value="Avaliação" action="avaliacao"
							actionListener="#{templateBean.esconderMenu()}"
							icon="pi pi-file-edit" ajax="false" />
						</p:submenu>
					</p:panelMenu>
				</h:form>
			</aside>

			<main class="conteudo-central">
				<ui:insert name="conteudo">
					<h:outputText value="Selecione uma opção no menu." />
				</ui:insert>
			</main>
		</h:panelGroup>
	</div>
</h:body>
</html>
