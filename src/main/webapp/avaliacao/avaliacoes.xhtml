<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/layout.xhtml">

	<ui:define name="conteudo">
		<h:form id="formAvaliacao">
			<p:panel header="Ficha de Avaliação">
				<div class="ui-fluid">
					<p:panelGrid columns="2" layout="grid"
						columnClasses="ui-grid-col-2, ui-grid-col-10">
						<p:outputLabel value="Paciente:" style="font-weight: bold;" />
						<h:outputText id="paciente"
							value="#{avaliacaoBean.avaliacao.paciente.nome}"
							style="font-size: 1.2em; color: #2c3e50;" />
					</p:panelGrid>

					<p:tabView style="margin-top: 20px;">
						<p:tab title="Histórico e Diagnóstico">
							<p:panelGrid columns="1" layout="grid">
								<p:outputLabel value="Histórico Atual (HDA):" />
								<p:inputTextarea value="#{avaliacaoBean.avaliacao.hda}"
									maxlength="1000" rows="3" />

								<p:outputLabel value="Diagnóstico Médico:" />
								<p:inputTextarea
									value="#{avaliacaoBean.avaliacao.diagnosticoMedico}"
									maxlength="1000" rows="3" />

								<h:panelGroup>
									<p:selectBooleanCheckbox
										value="#{avaliacaoBean.avaliacao.procurouOrtopedista}" />
									<h:outputText value=" Procurou médico ortopedista?" />
								</h:panelGroup>
							</p:panelGrid>
						</p:tab>

						<p:tab title="Exames e Testes">
							<p:panelGrid columns="1" layout="grid">
								<p:outputLabel value="Exames de Imagem:" />
								<p:inputTextarea value="#{avaliacaoBean.avaliacao.examesImagem}"
									maxlength="1000" />
								<p:outputLabel value="Testes Físicos:" />
								<p:inputTextarea
									value="#{avaliacaoBean.avaliacao.testesFisicos}"
									maxlength="1000" />
								<p:outputLabel value="Testes de Força:" />
								<p:inputTextarea value="#{avaliacaoBean.avaliacao.testesForca}"
									maxlength="1000" />
							</p:panelGrid>
						</p:tab>

						<p:tab title="Avaliação Física">
							<p:panelGrid columns="2" layout="grid"
								columnClasses="ui-grid-col-2, ui-grid-col-10">
								<p:outputLabel value="Palpação:" />
								<p:selectOneMenu value="#{avaliacaoBean.avaliacao.palpacao}">
									<f:selectItem itemLabel="Selecione..." itemValue="" />
									<f:selectItems value="#{avaliacaoBean.palpacoes}" var="p"
										itemLabel="#{p.toString().replace('_', ' ')}" itemValue="#{p}" />
								</p:selectOneMenu>

								<p:outputLabel value="Escala Visual Analógica de Dor (EVA):" />
								<h:panelGroup id="painelDor" layout="block"
									style="width: 100%; padding: 20px 0;">

									<div
										style="display: flex; width: 100%; font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">
										<div style="flex: 2; text-align: center; color: #228B22;">LEVE</div>
										<div style="flex: 5; text-align: center; color: #DAA520;">MODERADA</div>
										<div style="flex: 3; text-align: center; color: #FF0000;">INTENSA</div>
									</div>

									<p:slider for="dorValue" minValue="0" maxValue="10" step="1"
										style="height: 15px; background: linear-gradient(to right, #90EE90 0%, #FFFF00 50%, #FF0000 100%); border-radius: 5px;">
										<p:ajax event="slideEnd" />
									</p:slider>

									<div
										style="display: flex; justify-content: space-between; margin-top: 5px; font-weight: bold;">
										<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
										<span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
									</div>

									<h:inputHidden id="dorValue"
										value="#{avaliacaoBean.avaliacao.escalaDor}" />
								</h:panelGroup>
							</p:panelGrid>
						</p:tab>
					</p:tabView>
				</div>

				<f:facet name="footer">
					<p:commandButton value="Salvar Avaliação"
						action="#{avaliacaoBean.salvar}" icon="pi pi-save" ajax="false"
						styleClass="ui-button-primary" />

					<p:spacer width="10" />

					<p:commandButton value="Cancelar / Voltar" action="avaliacao"
						ajax="false" immediate="true" icon="pi pi-times"
						styleClass="ui-button-secondary" />
				</f:facet>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
