<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Clínica de Fisioterapia</title>
	<h:outputStylesheet name="css/estilo.css" />
	<style>
body {
	margin: 0;
	font-family: Arial, sans-serif;
}

.wrapper {
	display: flex;
	flex-direction: column;
	height: 100vh;
}

.main-content {
	display: flex;
	flex: 1;
	overflow: hidden;
}

.menu-lateral {
	width: 250px;
	border-right: 1px solid #ccc;
	background: #f8f9fa;
	padding: 10px;
}

.conteudo-central {
	flex: 1;
	padding: 20px;
	overflow-y: auto;
}

.header {
	background: #007ad9;
	color: white;
}
</style>
</h:head>

<h:body>
	<div class="wrapper">
		<h:form id="headerForm">
			<p:toolbar styleClass="header">
				<f:facet name="left">
					<h:outputText value="Sistema Clínica - Fortaleza/CE"
						style="font-weight: bold; font-size: 1.2em; color:white;" />
				</f:facet>
				<f:facet name="right">
					<p:commandButton value="Sair" action="#{loginBean.logout}"
						icon="pi pi-power-off" ajax="false" />
				</f:facet>
			</p:toolbar>
		</h:form>

		<div class="main-content">
			<aside class="menu-lateral">
				<h:form id="menuForm">
					<p:panelMenu style="width:100%">
						<p:submenu label="Navegação">
							<p:menuitem value="Início (Home)" action="irParaHome"
								icon="pi pi-home" ajax="false" />
						</p:submenu>
						<p:submenu label="Módulos">
							<p:menuitem value="Pacientes" action="paciente"
								icon="pi pi-users" ajax="false" />
						</p:submenu>
					</p:panelMenu>
				</h:form>
			</aside>

			<main class="conteudo-central">
				<ui:insert name="conteudo">
					<h:outputText value="Selecione uma opção no menu." />
				</ui:insert>
			</main>
		</div>
	</div>
</h:body>
</html>
