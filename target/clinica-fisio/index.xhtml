<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
	<title>Login - Clínica de Fisioterapia</title>
	<h:outputStylesheet library="css" name="estilo.css" />
	<style>
.login-container {
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	background-color: #f4f7f6;
}

.card-login {
	width: 350px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
</style>
</h:head>

<h:body>
	<div class="login-container">
		<h:form id="formLogin">
			<p:messages id="messages" closable="true">
				<p:autoUpdate />
			</p:messages>

			<p:panel header="Acesso ao Sistema" styleClass="card-login">
				<h:panelGrid columns="1" style="width: 100%;" cellpadding="5">

					<p:outputLabel for="usuario" value="Usuário:" />
					<p:inputText id="usuario" value="#{loginBean.usuario}"
						required="true" requiredMessage="O campo Usuário é obrigatório"
						placeholder="Digite seu usuário" style="width:100%;" />

					<p:outputLabel for="senha" value="Senha:" />
					<p:password id="senha" value="#{loginBean.senha}" required="true"
						requiredMessage="O campo Senha é obrigatório"
						placeholder="Digite sua senha" style="width:100%;" />

					<p:commandButton value="Entrar" action="#{loginBean.efetuarLogin}"
						ajax="false" icon="pi pi-sign-in"
						style="margin-top:15px; width:100%;" />
				</h:panelGrid>

				<f:facet name="footer">
					<div style="text-align: center; font-size: 0.9em; color: #666;">
						Versão 1.0 - Clínica Fortaleza</div>
				</f:facet>
			</p:panel>
		</h:form>
	</div>
</h:body>
</html>
