<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Clinica-fisio</title>
	<meta http-equiv="refresh" content="2;url=index.xhtml" />
	<h:outputStylesheet library="css" name="estilo.css" />
</h:head>
<h:body
	style="display:flex; justify-content:center; align-items:center; height:100vh; background-color:#f4f4f4; font-family: sans-serif;">
	<p:panel header="Você não está logado"
		style="width: 400px; text-align: center;">
		<h:panelGrid columns="1" style="width: 100%;">
			<i class="pi pi-check-circle" style="font-size: 3rem; color: green;"></i>
			<h:outputText value="Sua sessão foi encerrada com segurança."
				style="font-weight: bold; margin-top: 10px;" />
			<h:outputText
				value="Você será redirecionado para a tela de login em instantes..."
				style="font-size: 0.9em; color: #666;" />

			<p:link value="Clique aqui se não for redirecionado"
				href="index.xhtml" style="margin-top: 15px;" />
		</h:panelGrid>
	</p:panel>
</h:body>
</html>
