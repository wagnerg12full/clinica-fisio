<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/layout.xhtml">

	<ui:define name="conteudo">
		<h:form id="formCadastro">
			<p:messages id="messages" closable="true">
				<p:autoUpdate />
			</p:messages>

			<p:panel
				header="#{pacienteBean.paciente.id == null ? 'Novo Cadastro' : 'Edição de Paciente'}">
				<div class="ui-fluid">
					<p:panelGrid columns="2" layout="grid"
						columnClasses="ui-grid-col-2, ui-grid-col-10"
						styleClass="ui-panelgrid-blank">

						<p:outputLabel for="nome" value="Nome Completo:" />
						<p:inputText id="nome" value="#{pacienteBean.paciente.nome}"
							required="true" requiredMessage="O nome é obrigatório." />

						<p:outputLabel for="dataNasc" value="Data de Nascimento:" />
						<p:calendar id="dataNasc"
							value="#{pacienteBean.paciente.dataNascimento}"
							pattern="dd/MM/yyyy" mask="true" navigator="true" />

						<p:outputLabel for="endereco" value="Endereço:" />
						<p:inputText id="endereco"
							value="#{pacienteBean.paciente.endereco}" />

						<p:outputLabel for="profissao" value="Profissão:" />
						<p:inputText id="profissao"
							value="#{pacienteBean.paciente.profissao}" />

						<p:outputLabel for="queixa" value="Queixa Principal:" />
						<h:panelGroup>
							<p:inputTextarea id="queixa"
								value="#{pacienteBean.paciente.queixaPrincipal}" rows="8"
								maxlength="4000" counter="display"
								counterTemplate="{0} caracteres restantes." autoResize="false"
								required="true"
								requiredMessage="A queixa principal é obrigatória." />
							<br />
							<h:outputText id="display" style="font-size: 0.8em; color: #666;" />
						</h:panelGroup>
					</p:panelGrid>
				</div>

				<f:facet name="footer">
					<p:commandButton value="Confirmar e Salvar"
						action="#{pacienteBean.salvar}" icon="pi pi-check" ajax="false"
						styleClass="ui-button-primary" style="width: auto;" />

					<p:spacer width="10" />

					<p:commandButton value="Cancelar / Voltar" action="paciente"
						ajax="false" immediate="true" icon="pi pi-times"
						styleClass="ui-button-secondary" />
				</f:facet>
			</p:panel>
		</h:form>
	</ui:define>

</ui:composition>
