<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/layout.xhtml">

	<ui:define name="conteudo">
		<h:form id="formListagem">
			<p:messages id="messages" closable="true">
				<p:autoUpdate />
			</p:messages>
			<p:panel header="Histórico de Avaliações">

				<p:toolbar style="margin-bottom: 20px;">
					<f:facet name="left">
						<div class="ui-inputgroup">
							<p:outputLabel for="filtro" value="Paciente: "
								style="margin-right: 10px; align-self: center;" />
							<p:inputText id="filtro"
								value="#{avaliacaoBean.filtroNomePaciente}"
								placeholder="Nome do paciente..." style="width: 300px;" />
							<p:commandButton action="#{avaliacaoBean.pesquisar}"
								icon="pi pi-search" ajax="false" styleClass="ui-button-warning" />
						</div>
					</f:facet>

					<f:facet name="right">
						<p:commandButton value="Sair do Módulo" action="irParaHome"
							actionListener="#{templateBean.mostrarMenu()}"
							icon="pi pi-home" ajax="false" styleClass="ui-button-secondary" />
					</f:facet>
				</p:toolbar>

				<p:spacer height="20" />

				<p:dataTable id="tabelaPaciente"
					value="#{avaliacaoBean.listaPacientes}" var="paciente"
					emptyMessage="Nenhuma avaliação encontrada." rows="10"
					paginator="true" paginatorPosition="bottom"
					styleClass="products-table">

					<p:column headerText="Paciente" sortBy="#{ficha.paciente.nome}">
						<h:outputText value="#{paciente.nome}" />
					</p:column>

					<p:column headerText="Profissão">
						<h:outputText value="#{paciente.profissao}" />
					</p:column>

					<p:column headerText="Data de Nascimento"
						style="text-align: center; width: 150px;">
						<h:outputText value="#{paciente.dataNascimento}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</h:outputText>
					</p:column>

					<p:column headerText="Ações"
						style="width: 10%; text-align: center;">
						<p:commandButton icon="pi pi-plus-circle"
							title="Iniciar Avaliação"
							action="#{avaliacaoBean.iniciarAvaliacao(paciente)}" ajax="false"
							styleClass="ui-button-warning rounded-button">
						</p:commandButton>
						<p:spacer width="10" />
						<p:commandButton icon="pi pi-pencil"
							title="Ver/Editar Última Avaliação"
							action="#{avaliacaoBean.carregarAvaliacaoAtual(paciente)}"
							ajax="false" styleClass="ui-button-info rounded-button">
						</p:commandButton>
					</p:column>
				</p:dataTable>

			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
